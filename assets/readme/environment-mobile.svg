<svg xmlns="http://www.w3.org/2000/svg" width="640" height="275" viewBox="0 0 640 275" role="img" aria-labelledby="t d"><title id="t">Node.js 22 or later. npm ci, then npm run dev. Core catalogue works without service credentials.</title><desc id="d">Node.js 22 or later. npm ci, then npm run dev. Core catalogue works without service credentials. Conceptual card illustration, not a real payment card, issuer product or financial result.</desc><style>@keyframes cardfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.cardfloat{animation:cardfloat 10s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.cardfloat,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="245" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 38) scale(1.0)"><path d="M4 7h36v31H4zM11 16l7 7-7 7M25 30h8" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="112" y="74" font-family="Bahnschrift, Arial, sans-serif" font-size="28" fill="#F8F8F3" font-weight="600" >START WITH THE CATALOGUE</text><text x="46" y="139" font-family="Bahnschrift, Arial, sans-serif" font-size="27" fill="#F3D962" font-weight="600" >Node 22+ / npm ci / npm run dev</text><text x="46" y="195" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >The core catalogue does not require API</text><text x="46" y="229" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >keys or a database.</text></svg>