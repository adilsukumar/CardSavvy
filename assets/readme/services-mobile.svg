<svg xmlns="http://www.w3.org/2000/svg" width="640" height="747" viewBox="0 0 640 747" role="img" aria-labelledby="t d"><title id="t">OPTIONAL CHAT. Server-only Groq configuration enables Artificial Intelligence chat.; COMMUNITY IMPORTS. Optional offer sync reads external community/RSS sources.; OPTIONAL STORAGE. A configured Supabase client can store imported community offers.</title><desc id="d">OPTIONAL CHAT. Server-only Groq configuration enables Artificial Intelligence chat.; COMMUNITY IMPORTS. Optional offer sync reads external community/RSS sources.; OPTIONAL STORAGE. A configured Supabase client can store imported community offers. Conceptual card illustration, not a real payment card, issuer product or financial result.</desc><style>@keyframes cardfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}.cardfloat{animation:cardfloat 10s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@keyframes breathe{50%{r:13;opacity:.55}}.node{animation:breathe 6s ease-in-out infinite}@keyframes vector{50%{transform:rotate(-9deg)}}@keyframes float{50%{transform:translateY(-5px)}}.pulse{animation:pulse 5s ease-in-out infinite}.vector{animation:vector 12s ease-in-out infinite;transform-origin:0 0}.float{animation:float 8s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.cardfloat,.node,.pulse,.vector,.float{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="230" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 34) scale(0.9090909090909091)"><path d="M14 10L3 22l11 12M30 10l11 12-11 12M26 5l-8 34" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="104" y="63" font-family="Bahnschrift, Arial, sans-serif" font-size="23" fill="#F3D962" font-weight="600" >OPTIONAL CHAT</text><text x="48" y="122" font-family="Bahnschrift, Arial, sans-serif" font-size="25" fill="#BCFCF6" font-weight="400" >Server-onl